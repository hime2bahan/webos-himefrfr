<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebOS</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body style="background-color: rgb(36, 138, 189); font-family: Trattatello, fantasy; background-image: url('./8ed5970d08efc3f7259e5ab94fcebf14.jpg'); background-size: cover;">
  
  
  <div class="window" id="welcome" style="top: calc(50% - 90px); left: calc(50% - 180px); width: 500px; padding: 16px;">
    <div class="windowheader" id="welcomeheader">
      <p style="margin: 0;">Handle</p>
      <div class="closebutton" id="welcomeclose"></div>
    </div>

    <h1 style="margin: 4px; color: #fff;">Welcome to my world</h1>
    <h2 style="color:aliceblue;">姫だよ~</h2>
    <p style="color:rgb(178, 235, 216)">Hello ladies and gentlemen!</p>  
    <a style="color:bisque;" href="https://pin.it/3OUx2jZSF/">peakaboo</a>
    <video style="width: 70px; height: 70px;" src="./1yfi00p8krse1.mp4" controls></video>
  </div>

 
  <div id="top" style="position: absolute; top: 0; left: 0; width: 100%; backdrop-filter: blur(10px); background-color: rgba(0, 0, 0, 0.25); color: #312a3a; display: flex; justify-content: space-between; align-items: center; z-index: 10;"> 
    <p style="margin-left: 16px; color: #fff;" class="taskbar-button" id="welcomeopen">
      himefrfr
    </p>
    <p id="timeElement" style="margin-right: 16px; color: #fff;">
      21/10/2026 18:43 PM
    </p>
  </div>

  <div class="selected" id="desktopApps" style="padding-top: 64px; padding-left: 16px; display: flex; gap: 16px;">
    
   
    <div id="appLauncher" style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
      <img src="./IMG_3333.jpeg" style="width: 65px; height: 65px; border-radius: 16px;">
      <p style="margin: 0px; color: #fff;">hime's yapping sessions</p> 
    </div>

    
    <div id="wisdomLauncher" style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
      <img src="./IMG_3334.jpeg" alt="WisdomWhimsy" style="width: 65px; height: 65px; border-radius: 16px; background-color: #252429; object-fit: cover;">
      <p style="margin: 0px; color: #fff;">wisdomwhimsy</p> 
    </div>

    
    <div class="window" id="himesyappingsessions" style="display: none; top: calc(20% - 90px); left: calc(45% - 180px); width: 580px; padding: 16px;">
      <div class="windowheader" id="himesyappingsessionsheader">
        <p style="margin: 0;">hime's yapping sessions~</p>
        <div class="closebutton" id="yappingclose"></div>
      </div>

      <div style="background-color: #fff; margin-top: 12px; border-radius: 12px; width: 100%; height: 480px; padding: 16px; font-family: Courier; display: flex;">
        <div style="background-color: #F9F9F9; width: 200px; margin-right: 16px; padding: 12px; border-radius: 16px; display: flex; flex-direction: column;">
          <button id="newNoteBtn" style="padding: 8px; margin-bottom: 12px; background: #338eda; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: Courier; font-weight: bold;">+ New Note</button>
          <div id="notesList" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column;">
          <textarea id="noteTitleInput" placeholder="Note Title..." style="font-family: Courier; font-weight: bold; font-size: 16px; border: none; border-bottom: 1px solid #ddd; margin-bottom: 8px; padding: 4px; outline: none;"></textarea>
          <textarea id="noteContentInput" placeholder="Start yapping here..." style="font-family: Courier; flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 12px; resize: none; outline: none;"></textarea>
        </div>
      </div>
    </div>

    <div class="window" id="wisdomwhimsy" style="display: none; top: calc(25% - 90px); left: calc(50% - 180px); width: 620px; padding: 16px;">
      <div class="windowheader" id="wisdomwhimsyheader">
        <p style="margin: 0;">wisdomwhimsy ~ quote gallery</p>
        <div class="closebutton" id="wisdomclose"></div>
      </div>

      <div style="background-color: #17171d; margin-top: 12px; border-radius: 12px; width: 100%; height: 490px; padding: 16px; font-family: Georgia, serif; color: #fff; display: flex; flex-direction: column; gap: 12px;">
        
       
        <div id="quoteDisplayCard" style="background: linear-gradient(135deg, #252429, #1f2d3d); border-radius: 12px; padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);">
          <p id="quoteText" style="font-size: 18px; font-style: italic; margin-bottom: 12px; color: #f9fafc;">"Time Will Tell"</p>
          <p id="quoteAuthor" style="font-size: 14px; color: #338eda; margin: 0; font-weight: bold;">~ hime</p>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <div id="quoteThumbnails" style="display: flex; gap: 8px; overflow-x: auto; flex: 1; padding: 4px;">
          
          </div>
        </div>

        <div style="display: flex; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">
          <input type="text" id="newQuoteText" placeholder="Type a quote..." style="flex: 2; padding: 6px 10px; border-radius: 6px; border: none; font-family: Georgia, serif; outline: none; background: #252429; color: #fff;">
          <input type="text" id="newQuoteAuthor" placeholder="Author..." style="flex: 1; padding: 6px 10px; border-radius: 6px; border: none; font-family: Georgia, serif; outline: none; background: #252429; color: #fff;">
          <button id="addQuoteBtn" style="padding: 6px 12px; background: #a633d6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Add</button>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
